<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: sans-serif; width: 220px; padding: 12px; margin: 0; }
    button {
      width: 100%; margin: 6px 0; padding: 8px; font-weight: bold;
      cursor: pointer; background: #c00; color: white; border: none; border-radius: 4px;
    }
    button:hover { background: #900; }
    #openDashboardBtn { background: #065fd4; }
    #openDashboardBtn:hover { background: #04469e; }
    hr { border: none; border-top: 1px solid #ddd; margin: 10px 0; }
    .hint { font-size: 11px; color: #555; }
    #status { font-size: 11px; color: #0b57d0; font-weight: bold; margin-top: 6px; }
  </style>
</head>
<body>
  <p class="hint">1. Open <b>youtube.com/feed/channels</b> and export:</p>
  <button id="exportBtn">Export to CSV</button>

  <hr>

  <p class="hint">2. Import CSV into table view:</p>
  <button id="openDashboardBtn">Open Sub Table</button>

  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
