<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>YouTube Subscriptions Manager</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      margin: 0;
      padding: 30px 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #ffffff;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    h2 {
      margin-top: 0;
      color: #0f0f0f;
    }
    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding: 16px;
      background: #f1f3f4;
      border-radius: 6px;
    }
    .stats {
      font-size: 14px;
      font-weight: bold;
      color: #333;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      padding: 12px 14px;
      text-align: left;
      border-bottom: 1px solid #e5e5e5;
    }
    th {
      background-color: #f8f9fa;
      font-size: 13px;
      color: #555;
      text-transform: uppercase;
    }
    tr:hover {
      background-color: #fdfdfd;
    }
    .btn-action {
      display: inline-block;
      text-decoration: none;
      padding: 7px 14px;
      border-radius: 18px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }
    /* Red: Not yet clicked */
    .btn-unsub {
      background-color: #cc0000;
      color: #ffffff;
      border: 1px solid #cc0000;
    }
    .btn-unsub:hover {
      background-color: #990000;
    }
    /* Green: Clicked / Subscribed */
    .btn-done {
      background-color: #2ba640;
      color: #ffffff;
      border: 1px solid #2ba640;
    }
    .btn-done:hover {
      background-color: #238634;
    }
    /* Row style when done */
    tr.is-done td.channel-name {
      color: #888;
      text-decoration: line-through;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>YouTube Subscriptions Transfer</h2>

    <div class="controls">
      <div>
        <label><b>Choose your CSV file: </b></label>
        <input type="file" id="csvFileInput" accept=".csv">
      </div>
      <div id="stats" class="stats"></div>
    </div>

    <table id="subTable" style="display: none;">
      <thead>
        <tr>
          <th style="width: 40px;">#</th>
          <th>Channel Name</th>
          <th style="width: 180px; text-align: center;">Action</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <script src="table.js"></script>
</body>
</html>
